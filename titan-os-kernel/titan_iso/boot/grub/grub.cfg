set default=0
set timeout=2
set color_normal=cyan/black
set color_highlight=black/cyan

menuentry "TITAN OS // BARE-METAL SWARM NODE" --class os {
    echo 'Loading Titan OS Kernel into RAM...'
    echo 'Initializing e1000 Gigabit Ethernet...'
