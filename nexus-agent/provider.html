<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Provider Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #00ffcc; font-family: ui-monospace, monospace; }
        .log-box { height: 250px; overflow-y: auto; background: #000; border: 1px solid #1f2937; }
        input[type=range] { accent-color: #00ffcc; }
    </style>
</head>
<body class="p-8 flex flex-col gap-6 h-screen">
    <header class="border-b border-cyan-800 pb-4 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-bold tracking-widest text-cyan-400">NEXUS AGENT <span class="text-gray-500">//</span> TIER 2</h1>
            <p class="text-sm text-gray-400 mt-1">Background Compute Provider</p>
        </div>
        <div class="text-right">
            <p class="text-xs text-gray-500">Status</p>
            <p id="status" class="text-green-400 font-bold animate-pulse">CONNECTING...</p>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <section class="bg-black border border-gray-800 p-6 rounded-md">
            <h2 class="text-xl font-semibold mb-6 text-gray-300 border-b border-gray-800 pb-2">⚙️ HARDWARE ALLOCATION</h2>
            
            <label class="block text-sm text-gray-400 mb-2">Max CPU / RAM Usage Limit: <span id="cpu-val" class="text-cyan-300 font-bold">50%</span></label>
            <input type="range" id="cpu-slider" min="10" max="100" value="50" class="w-full mb-6 cursor-pointer">
            
            <p class="text-xs text-gray-500 mb-4">Set how much hardware Nexus can use. Lower settings ensure your PC never hangs while you work.</p>
            
            <div class="bg-gray-900 p-4 rounded border border-gray-800">
                <p class="text-gray-500 text-sm">Passive Income Earned</p>
                <p id="wallet" class="text-3xl font-bold text-yellow-400">0.0000 NXC</p>
            </div>
        </section>

        <section class="bg-black border border-gray-800 p-4 rounded-md log-box flex flex-col" id="logs">
            <div class="text-gray-500 mb-2">➜ [SYS] INITIALIZING LOCAL AGENT...</div>
        </section>
    </div>

    <script>
        const logs = document.getElementById('logs');
        const cpuSlider = document.getElementById('cpu-slider');
        const cpuVal = document.getElementById('cpu-val');
        const wallet = document.getElementById('wallet');
        const status = document.getElementById('status');
        let nxc = 0.0000;

        function addLog(msg, color="text-gray-300") {
            logs.innerHTML += `<div class="mb-1"><span class="text-green-500">➜ </span><span class="${color}">${msg}</span></div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        cpuSlider.addEventListener('input', (e) => {
            cpuVal.innerText = e.target.value + '%';
            ws.send(JSON.stringify({ type: 'UPDATE_CPU', value: e.target.value }));
            addLog(`[HW] Hardware limit dynamically adjusted to ${e.target.value}%`, "text-cyan-500");
        });

        // Connect to the Local Agent Backend
        const ws = new WebSocket('ws://localhost:4001');

        ws.onopen = () => {
            status.innerText = "ONLINE & MINING";
            addLog("[SYS] Agent Dashboard successfully connected to Core Engine.");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'LOG') {
                addLog(data.message, data.color);
            } else if (data.type === 'EARN') {
                nxc += data.amount;
                wallet.innerText = nxc.toFixed(4) + ' NXC';
            }
        };

        ws.onclose = () => { status.innerText = "OFFLINE"; status.classList.replace("text-green-400", "text-red-500"); };
    </script>
</body>
</html>
