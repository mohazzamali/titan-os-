<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS Edge Portal</title>
    <style>
        body { background-color: #0A0A0A; color: #00FF41; font-family: 'Courier New', monospace; padding: 20px; }
        .console-box { background-color: #000; border: 1px solid #333; padding: 15px; height: 300px; overflow-y: auto; margin-bottom: 20px; }
        button { background-color: #00FF41; color: #000; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-right: 10px;}
        .zk-btn { background-color: #FF00FF; color: white; }
    </style>
</head>
<body>
    <h1>🌐 NEXUS EDGE PORTAL v3.0 (Zero-Knowledge Edition)</h1>
    <p>Status: <span id="status" style="color: yellow;">AWAITING LINK</span></p>

    <div class="console-box" id="terminal"></div>
    <div id="controls" style="display:none;">
        <button onclick="sendTask('EXECUTE_WASM')">[ DISPATCH STANDARD WASM ]</button>
        <button class="zk-btn" onclick="sendTask('VERIFY_ZK_PROOF')">[ VERIFY ZERO-KNOWLEDGE PROOF ]</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        function log(msg) { terminal.innerHTML += `<div>[SYS] ${msg}</div>`; terminal.scrollTop = terminal.scrollHeight; }

        log("Connecting to Signaling Bridge...");
        const ws = new WebSocket('ws://localhost:8080');
        
        ws.onopen = () => {
            log("🟢 [ CONNECTED ] Secure P2P Tunnel Established!");
            document.getElementById('status').innerText = "LINK ACTIVE";
            document.getElementById('controls').style.display = "block";
        };

        function sendTask(type) {
            ws.send(type);
            log(`📤 [ DISPATCH ] ${type} payload injected into Bare-Metal Mesh.`);
        }
    </script>
</body>
</html>
