[package]
name = "nexus-core"
version = "0.1.0"
edition = "2021"

[dependencies]
uefi = { version = "0.33.0", features = ["alloc", "logger"] }
log = "0.4"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
volatile = "0.4.6"
spin = "0.9.9"
x86_64 = "0.14.13"
pc-keyboard = "0.5.1"
pic8259 = "0.10.4"

# 🚀 The Ultimate Memory Manager (Only ONE version now)
linked_list_allocator = "0.10"

ed25519-compact = { version = "2.3.1", default-features = false }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
smoltcp = { version = "0.11.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-udp", "socket-tcp", "socket-dhcpv4"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true