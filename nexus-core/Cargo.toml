[package]
name = "nexus-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.35", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"
pc-keyboard = "0.5.0"
pic8259 = "0.10.1"
linked_list_allocator = "0.9.0"
ed25519-compact = { version = "2.1.1", default-features = false }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
smoltcp = { version = "0.11.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-udp", "socket-tcp", "socket-dhcpv4"] }

[profile.release]
# ... (Upar ka code waise hi rehne dijiye)

[package.metadata.bootimage]
# 🚀 THE MAGIC TUNNEL: Official way to forward Mac Port 9999 to QEMU OS Port 9999
run-args = ["-netdev", "user,id=net0,hostfwd=tcp::9999-:9999", "-device", "e1000,netdev=net0"]