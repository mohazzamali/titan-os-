[package]
name = "nexus-ai-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"     # Optimize for minimum file size
lto = true          # Link Time Optimization
panic = "abort"     # No unwinding in bare-metal
strip = true        # Strip symbols
