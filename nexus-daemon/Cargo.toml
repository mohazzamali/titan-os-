[package]
name = "nexus-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "ping", "macros", "mdns", "gossipsub"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasmtime = "48.0.2"
